# fly.toml app configuration file generated for payun-consultora on 2026-10-09T17:27:26-03:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'payun-consultora'
primary_region = 'gru'
kill_signal = 'SIGTERM'

[build]

[env]
  PHX_HOST = 'payunconsultora.com.ar'
  PORT = '8080'
  PHX_SERVER = "true"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 1000
    soft_limit = 1000

[[vm]]
  memory = '512mb'
  cpus = 1
  memory_mb = 512
